name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소해요
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Node 설치
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: Lint 검사
        run: npm run lint

      - name: 빌드
        run: npm run build
